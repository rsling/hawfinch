[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hawfinch"
version = "0.0.1"
description = "Extracts grammatical features of German words from Wiktionary dumps"
license = "BSD-2-Clause"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "pyarrow>=26.0.1",
]

[project.scripts]
hawfinch = "hawfinch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
